      function WallOfLove(){
        const sectionRef=useRef(null);
        const [ready,setReady]=useState(false);
        const [tweets,setTweets]=useState({});
        const [errors,setErrors]=useState({});
        const [shouldLoad,setShouldLoad]=useState(false);
        const [isMobile,setIsMobile]=useState(()=>window.matchMedia("(max-width:620px)").matches);
        const [mobileLoveBatch,setMobileLoveBatch]=useState(0);
        const [desktopLoveBatches,setDesktopLoveBatches]=useState([0,0,0]);
        const mobileLovePosts=getLoveBatch(mobileLoveBatch);
        const loveColumns=desktopLoveBatches.map((batchIndex,columnIndex)=>{
          const batch=getLoveBatch(batchIndex);
          const start=columnIndex*LOVE_COLUMN_SIZE;
          return batch.slice(start,start+LOVE_COLUMN_SIZE);
        });
        const activeLovePosts=isMobile?mobileLovePosts:loveColumns.flat();
        const nextLovePosts=isMobile
          ? getLoveBatch(mobileLoveBatch+1)
          : desktopLoveBatches.flatMap((batchIndex,columnIndex)=>{
              const batch=getLoveBatch(batchIndex+1);
              const start=columnIndex*LOVE_COLUMN_SIZE;
              return batch.slice(start,start+LOVE_COLUMN_SIZE);
            });
        const postsToLoad=[...new Set(activeLovePosts)];
        const postsToPrefetch=[...new Set(nextLovePosts)];
        const desktopLoveBatchKey=desktopLoveBatches.join(",");
        const advanceLoveColumn=columnIndex=>setDesktopLoveBatches(current=>
          current.map((batchIndex,index)=>index===columnIndex?(batchIndex+1)%LOVE_BATCH_COUNT:batchIndex)
        );
        useEffect(()=>{
          const query=window.matchMedia("(max-width:620px)");
          const update=event=>setIsMobile(event.matches);
          query.addEventListener("change",update);
          return()=>query.removeEventListener("change",update);
        },[]);
        useEffect(()=>{
          if(!("IntersectionObserver" in window)){ setShouldLoad(true); return; }
          const observer=new IntersectionObserver(([entry])=>{
            if(!entry.isIntersecting)return;
            setShouldLoad(true);
            observer.disconnect();
          },{rootMargin:"500px 0px"});
          if(sectionRef.current) observer.observe(sectionRef.current);
          return()=>observer.disconnect();
        },[]);
        useEffect(()=>{
          if(!shouldLoad)return;
          const controller=new AbortController();
          let startTimer;
          let preloadTimer;
          const loadPost=async url=>{
            const id=postId(url);
            if(tweets[id]||errors[id])return;
            try{
              const response=await fetch(`https://react-tweet.vercel.app/api/tweet/${id}`,{signal:controller.signal});
              if(!response.ok) throw new Error(`Post request failed with ${response.status}`);
              const payload=await response.json();
              if(!payload.data) throw new Error("Post data missing");
              setTweets(current=>({...current,[id]:payload.data}));
            }catch(error){
              if(error.name!=="AbortError") setErrors(current=>({...current,[id]:true}));
            }
          };
          Promise.all(postsToLoad.map(loadPost)).then(()=>{
            startTimer=window.setTimeout(()=>setReady(true),LOVE_TIMING.startAfterLoadMs);
            preloadTimer=window.setTimeout(()=>{ Promise.all(postsToPrefetch.map(loadPost)); },LOVE_TIMING.startAfterLoadMs*2);
          });
          return()=>{
            controller.abort();
            if(startTimer) window.clearTimeout(startTimer);
            if(preloadTimer) window.clearTimeout(preloadTimer);
          };
        },[shouldLoad,isMobile,mobileLoveBatch,desktopLoveBatchKey]);
        const renderCycle=(posts,columnIndex,isClone)=>e("div",{
          className:"love-cycle",
          key:isClone?"clone":"original",
          "aria-hidden":isClone?"true":undefined,
          inert:isClone?true:undefined
        },...posts.map(url=>{const id=postId(url);return e("div",{className:"love-post",key:`${url}-${isClone?"clone":"original"}`},
          e(TweetCard,{url,tweet:tweets[id],error:errors[id]})
        );}));
        const renderColumn=(posts,columnIndex,key)=>e("div",{className:`love-column${ready?" is-ready":""}`,key},
          e("div",{className:"love-viewport"},
            e("div",{
              className:"love-column-track",
              onAnimationIteration:event=>{
                if(event.target!==event.currentTarget)return;
                if(isMobile) setMobileLoveBatch(current=>(current+1)%LOVE_BATCH_COUNT);
                else advanceLoveColumn(columnIndex);
              }
            },renderCycle(posts,columnIndex,false),renderCycle(posts,columnIndex,true))
          )
        );
        return e("section",{ref:sectionRef,className:"love-section",id:"wall-of-love","data-theme":"light"},
          e("div",{className:"love-inner"},
            e("div",{className:"love-header"},
              e("div",null,
                e("h2",{className:"love-heading"},"Wall of Love"),
                e("p",{className:"love-intro"},"What our community is saying.")
              ),
              e("a",{className:"love-follow",href:"https://x.com/SuperteamDE",target:"_blank",rel:"noreferrer"},"Follow @SuperteamDE on X",e("span",{"aria-hidden":"true"},"→"))
            ),
            isMobile
              ? e("div",{className:"love-mobile","aria-label":"Community posts from X"},renderColumn(mobileLovePosts,0,"mobile"))
              : e("div",{className:"love-columns","aria-label":"Community posts from X"},
                  ...loveColumns.map((posts,columnIndex)=>renderColumn(posts,columnIndex,columnIndex))

      function NewsletterCTA(){
        const [email,setEmail]=useState("");
        const [status,setStatus]=useState("idle");
        const [message,setMessage]=useState("");
        const inputRef=useRef(null);
        const timerRef=useRef(null);
        const controllerRef=useRef(null);
        const requestTimeoutRef=useRef(null);
        const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

        useEffect(()=>()=>{
          if(timerRef.current) window.clearTimeout(timerRef.current);
          if(requestTimeoutRef.current) window.clearTimeout(requestTimeoutRef.current);
          controllerRef.current?.abort();
        },[]);

        const handleChange=event=>{
          setEmail(event.target.value);
          if(status==="error"){
            setStatus("idle");
            setMessage("");
          }
        };

        const handleSubmit=async event=>{
          event.preventDefault();
          const value=email.trim();
          if(!emailPattern.test(value)){
            setStatus("error");
            setMessage("Enter a valid email address.");
            inputRef.current?.focus();
            return;
          }

          setStatus("loading");
          setMessage("Adding you to the newsletter…");
          try{
            const controller=new AbortController();
            controllerRef.current=controller;
            requestTimeoutRef.current=window.setTimeout(()=>controller.abort(),10000);
            const response=await fetch("/api/newsletter",{
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body:JSON.stringify({email:value,group:"default"}),
              signal:controller.signal
            });
            if(response.status!==201) throw new Error(`Newsletter request failed with ${response.status}`);
            setEmail("");
            setStatus("success");
            setMessage("Thank you for subscribing! Please check your email to confirm your subscription.");
          }catch(error){
            setStatus("error");
            setMessage("We couldn’t complete your subscription. Please try again or use a different email address.");
            window.requestAnimationFrame(()=>inputRef.current?.focus());
          }finally{
            if(requestTimeoutRef.current) window.clearTimeout(requestTimeoutRef.current);
            requestTimeoutRef.current=null;
            controllerRef.current=null;
          }
        };

        const isLoading=status==="loading";
        return e("section",{className:"newsletter-section",id:"newsletter"},
          e("div",{className:"newsletter-accent","aria-hidden":"true"}),
          e("div",{className:"newsletter-inner"},
            e("h2",{className:"newsletter-heading"},"Stay close to what’s happening."),
            e("p",{className:"newsletter-copy"},"Get upcoming events, opportunities, and community updates from Superteam Germany."),
            status==="success"
              ? e("div",{className:"newsletter-success",role:"status","aria-live":"polite"},
                  e("h3",null,"You’re almost there."),
                  e("p",null,message)
                )
              : e(React.Fragment,null,
                  e("form",{className:`newsletter-form${status==="error"?" has-error":""}`,onSubmit:handleSubmit,noValidate:true},
                    e("label",{className:"newsletter-label",htmlFor:"newsletter-email"},"Email address"),
                    e("input",{className:"newsletter-input",id:"newsletter-email",ref:inputRef,type:"email",name:"email",value:email,onChange:handleChange,placeholder:"Email address",autoComplete:"email",inputMode:"email",required:true,disabled:isLoading,"aria-invalid":status==="error","aria-describedby":"newsletter-status"}),
                    e("button",{className:"newsletter-submit",type:"submit",disabled:isLoading},isLoading?"Subscribing…":"Subscribe")
                  ),
                  e("p",{className:`newsletter-status${status==="error"?" is-error":""}`,id:"newsletter-status",role:"status","aria-live":"polite"},message)
                )
          )
        );
      }
