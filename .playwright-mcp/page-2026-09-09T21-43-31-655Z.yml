      - generic [ref=f1e211]:
        - article [ref=f1e212]:
          - button "Who can participate?" [expanded] [ref=f1e213] [cursor=pointer]
          - paragraph [ref=f1e218]: Builders, founders, developers, designers, marketers and operators are welcome. You do not need to be a coder or an official Superteam member to take part.
        - article [ref=f1e219]:
          - button "Where is the BuildStation taking place?" [ref=f1e220] [cursor=pointer]
          - paragraph [ref=f1e223]: The hackathon itself is online. Germany-based co-working sessions and local BuildStation details will be shared through Superteam Germany’s official channels.
        - article [ref=f1e224]:
          - button "Are only German teams allowed to participate?" [ref=f1e225] [cursor=pointer]
          - paragraph [ref=f1e228]: No. Our support is focused on the German ecosystem, but international teammates and collaborators are welcome.
        - article [ref=f1e229]:
          - button "Can I bring my dog?" [ref=f1e230] [cursor=pointer]
          - paragraph [ref=f1e233]: That depends on the venue for each in-person session. Check the individual event details before bringing a four-legged teammate.
        - article [ref=f1e234]:
          - button "Is virtual mentorship available?" [ref=f1e235] [cursor=pointer]
          - paragraph [ref=f1e238]: Yes, some support can happen remotely. Availability and formats will be shared with registered builders through the community channels.
        - article [ref=f1e239]:
          - button "How much does it cost to participate?" [ref=f1e240] [cursor=pointer]
          - paragraph [ref=f1e243]: Joining the hackathon and Superteam Germany’s community support is free.
        - article [ref=f1e244]:
          - button "What is the BuildStation Code of Conduct?" [ref=f1e245] [cursor=pointer]
          - paragraph [ref=f1e248]: BuildStation is an inclusive, collaborative environment. Participants are expected to treat one another respectfully and follow the venue and hackathon rules.
        - article [ref=f1e249]:
          - button "Did we miss something?" [ref=f1e250] [cursor=pointer]
          - paragraph [ref=f1e253]: Send us a message on X or Telegram and the team will help you find the right answer.
