      - generic [ref=f27e193]:
        - article [ref=f27e194]:
          - button "Who can participate?" [expanded] [ref=f27e195] [cursor=pointer]
          - paragraph [ref=f27e200]: Builders, founders, developers, designers, marketers and operators are welcome. You do not need to be a coder or an official Superteam member to take part.
        - article [ref=f27e201]:
          - button "Where is the BuildStation taking place?" [ref=f27e202] [cursor=pointer]
          - paragraph [ref=f27e205]: The hackathon itself is online. Germany-based co-working sessions and local BuildStation details will be shared through Superteam Germany’s official channels.
        - article [ref=f27e206]:
          - button "Are only German teams allowed to participate?" [ref=f27e207] [cursor=pointer]
          - paragraph [ref=f27e210]: No. Our support is focused on the German ecosystem, but international teammates and collaborators are welcome.
        - article [ref=f27e211]:
          - button "Can I bring my dog?" [ref=f27e212] [cursor=pointer]
          - paragraph [ref=f27e215]: That depends on the venue for each in-person session. Check the individual event details before bringing a four-legged teammate.
        - article [ref=f27e216]:
          - button "Is virtual mentorship available?" [ref=f27e217] [cursor=pointer]
          - paragraph [ref=f27e220]: Yes, some support can happen remotely. Availability and formats will be shared with registered builders through the community channels.
        - article [ref=f27e221]:
          - button "How much does it cost to participate?" [ref=f27e222] [cursor=pointer]
          - paragraph [ref=f27e225]: Joining the hackathon and Superteam Germany’s community support is free.
        - article [ref=f27e226]:
          - button "What is the BuildStation Code of Conduct?" [ref=f27e227] [cursor=pointer]
          - paragraph [ref=f27e230]: BuildStation is an inclusive, collaborative environment. Participants are expected to treat one another respectfully and follow the venue and hackathon rules.
        - article [ref=f27e231]:
          - button "Did we miss something?" [ref=f27e232] [cursor=pointer]
          - paragraph [ref=f27e235]: Send us a message on X or Telegram and the team will help you find the right answer.
