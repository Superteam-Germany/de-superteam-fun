      - generic [ref=f9e192]:
        - article [ref=f9e193]:
          - button "Who can participate?" [expanded] [ref=f9e194] [cursor=pointer]
          - paragraph [ref=f9e199]: Builders, founders, developers, designers, marketers and operators are welcome. You do not need to be a coder or an official Superteam member to take part.
        - article [ref=f9e200]:
          - button "Where is the BuildStation taking place?" [ref=f9e201] [cursor=pointer]
          - paragraph [ref=f9e204]: The hackathon itself is online. Germany-based co-working sessions and local BuildStation details will be shared through Superteam Germany’s official channels.
        - article [ref=f9e205]:
          - button "Are only German teams allowed to participate?" [ref=f9e206] [cursor=pointer]
          - paragraph [ref=f9e209]: No. Our support is focused on the German ecosystem, but international teammates and collaborators are welcome.
        - article [ref=f9e210]:
          - button "Can I bring my dog?" [ref=f9e211] [cursor=pointer]
          - paragraph [ref=f9e214]: That depends on the venue for each in-person session. Check the individual event details before bringing a four-legged teammate.
        - article [ref=f9e215]:
          - button "Is virtual mentorship available?" [ref=f9e216] [cursor=pointer]
          - paragraph [ref=f9e219]: Yes, some support can happen remotely. Availability and formats will be shared with registered builders through the community channels.
        - article [ref=f9e220]:
          - button "How much does it cost to participate?" [ref=f9e221] [cursor=pointer]
          - paragraph [ref=f9e224]: Joining the hackathon and Superteam Germany’s community support is free.
        - article [ref=f9e225]:
          - button "What is the BuildStation Code of Conduct?" [ref=f9e226] [cursor=pointer]
          - paragraph [ref=f9e229]: BuildStation is an inclusive, collaborative environment. Participants are expected to treat one another respectfully and follow the venue and hackathon rules.
        - article [ref=f9e230]:
          - button "Did we miss something?" [ref=f9e231] [cursor=pointer]
          - paragraph [ref=f9e234]: Send us a message on X or Telegram and the team will help you find the right answer.
