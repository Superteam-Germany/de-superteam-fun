      - generic [ref=f29e192]:
        - article [ref=f29e193]:
          - button "Who can participate?" [expanded] [ref=f29e194] [cursor=pointer]
          - paragraph [ref=f29e199]: Builders, founders, developers, designers, marketers and operators are welcome. You do not need to be a coder or an official Superteam member to take part.
        - article [ref=f29e200]:
          - button "Where is the BuildStation taking place?" [ref=f29e201] [cursor=pointer]
          - paragraph [ref=f29e204]: The hackathon itself is online. Germany-based co-working sessions and local BuildStation details will be shared through Superteam Germany’s official channels.
        - article [ref=f29e205]:
          - button "Are only German teams allowed to participate?" [ref=f29e206] [cursor=pointer]
          - paragraph [ref=f29e209]: No. Our support is focused on the German ecosystem, but international teammates and collaborators are welcome.
        - article [ref=f29e210]:
          - button "Can I bring my dog?" [ref=f29e211] [cursor=pointer]
          - paragraph [ref=f29e214]: That depends on the venue for each in-person session. Check the individual event details before bringing a four-legged teammate.
        - article [ref=f29e215]:
          - button "Is virtual mentorship available?" [ref=f29e216] [cursor=pointer]
          - paragraph [ref=f29e219]: Yes, some support can happen remotely. Availability and formats will be shared with registered builders through the community channels.
        - article [ref=f29e220]:
          - button "How much does it cost to participate?" [ref=f29e221] [cursor=pointer]
          - paragraph [ref=f29e224]: Joining the hackathon and Superteam Germany’s community support is free.
        - article [ref=f29e225]:
          - button "What is the BuildStation Code of Conduct?" [ref=f29e226] [cursor=pointer]
          - paragraph [ref=f29e229]: BuildStation is an inclusive, collaborative environment. Participants are expected to treat one another respectfully and follow the venue and hackathon rules.
        - article [ref=f29e230]:
          - button "Did we miss something?" [ref=f29e231] [cursor=pointer]
          - paragraph [ref=f29e234]: Send us a message on X or Telegram and the team will help you find the right answer.
