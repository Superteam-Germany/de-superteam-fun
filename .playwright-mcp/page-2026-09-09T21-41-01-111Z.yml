          - button "Who can participate?" [expanded] [ref=e213] [cursor=pointer]
          - paragraph [ref=e218]: Builders, founders, developers, designers, marketers and operators are welcome. You do not need to be a coder or an official Superteam member to take part.
        - article [ref=e219]:
          - button "Where is the BuildStation taking place?" [ref=e220] [cursor=pointer]
          - paragraph [ref=e223]: The hackathon itself is online. Germany-based co-working sessions and local BuildStation details will be shared through Superteam Germany’s official channels.
        - article [ref=e224]:
          - button "Are only German teams allowed to participate?" [ref=e225] [cursor=pointer]
          - paragraph [ref=e228]: No. Our support is focused on the German ecosystem, but international teammates and collaborators are welcome.
        - article [ref=e229]:
          - button "Can I bring my dog?" [ref=e230] [cursor=pointer]
          - paragraph [ref=e233]: That depends on the venue for each in-person session. Check the individual event details before bringing a four-legged teammate.
        - article [ref=e234]:
          - button "Is virtual mentorship available?" [ref=e235] [cursor=pointer]
          - paragraph [ref=e238]: Yes, some support can happen remotely. Availability and formats will be shared with registered builders through the community channels.
        - article [ref=e239]:
          - button "How much does it cost to participate?" [ref=e240] [cursor=pointer]
          - paragraph [ref=e243]: Joining the hackathon and Superteam Germany’s community support is free.
        - article [ref=e244]:
          - button "What is the BuildStation Code of Conduct?" [ref=e245] [cursor=pointer]
          - paragraph [ref=e248]: BuildStation is an inclusive, collaborative environment. Participants are expected to treat one another respectfully and follow the venue and hackathon rules.
        - article [ref=e249]:
