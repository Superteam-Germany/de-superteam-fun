      - generic [ref=f2e209]:
        - article [ref=f2e210]:
          - button "Who can participate?" [expanded] [ref=f2e211] [cursor=pointer]
          - paragraph [ref=f2e216]: Builders, founders, developers, designers, marketers and operators are welcome. You do not need to be a coder or an official Superteam member to take part.
        - article [ref=f2e217]:
          - button "Where is the BuildStation taking place?" [ref=f2e218] [cursor=pointer]
          - paragraph [ref=f2e221]: The hackathon itself is online. Germany-based co-working sessions and local BuildStation details will be shared through Superteam Germany’s official channels.
        - article [ref=f2e222]:
          - button "Are only German teams allowed to participate?" [ref=f2e223] [cursor=pointer]
          - paragraph [ref=f2e226]: No. Our support is focused on the German ecosystem, but international teammates and collaborators are welcome.
        - article [ref=f2e227]:
          - button "Can I bring my dog?" [ref=f2e228] [cursor=pointer]
          - paragraph [ref=f2e231]: That depends on the venue for each in-person session. Check the individual event details before bringing a four-legged teammate.
        - article [ref=f2e232]:
          - button "Is virtual mentorship available?" [ref=f2e233] [cursor=pointer]
          - paragraph [ref=f2e236]: Yes, some support can happen remotely. Availability and formats will be shared with registered builders through the community channels.
        - article [ref=f2e237]:
          - button "How much does it cost to participate?" [ref=f2e238] [cursor=pointer]
          - paragraph [ref=f2e241]: Joining the hackathon and Superteam Germany’s community support is free.
        - article [ref=f2e242]:
          - button "What is the BuildStation Code of Conduct?" [ref=f2e243] [cursor=pointer]
          - paragraph [ref=f2e246]: BuildStation is an inclusive, collaborative environment. Participants are expected to treat one another respectfully and follow the venue and hackathon rules.
        - article [ref=f2e247]:
          - button "Did we miss something?" [ref=f2e248] [cursor=pointer]
          - paragraph [ref=f2e251]: Send us a message on X or Telegram and the team will help you find the right answer.
