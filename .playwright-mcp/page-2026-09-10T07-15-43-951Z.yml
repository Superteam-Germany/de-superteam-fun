        - heading "Frequently asked questions." [level=2] [ref=f14e190]
        - paragraph [ref=f14e191]: Can’t find what you’re looking for? Reach out and we’ll point you in the right direction.
        - link "Ask us on X ↗" [ref=f14e192] [cursor=pointer]:
