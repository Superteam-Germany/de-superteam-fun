      - generic [ref=f14e193]:
        - article [ref=f14e194]:
          - button "Who can participate?" [expanded] [ref=f14e195] [cursor=pointer]
          - paragraph [ref=f14e200]: Builders, founders, developers, designers, marketers and operators are welcome. You do not need to be a coder or an official Superteam member to take part.
        - article [ref=f14e201]:
          - button "Where is the BuildStation taking place?" [ref=f14e202] [cursor=pointer]
          - paragraph [ref=f14e205]: The hackathon itself is online. Germany-based co-working sessions and local BuildStation details will be shared through Superteam Germany’s official channels.
        - article [ref=f14e206]:
          - button "Are only German teams allowed to participate?" [ref=f14e207] [cursor=pointer]
          - paragraph [ref=f14e210]: No. Our support is focused on the German ecosystem, but international teammates and collaborators are welcome.
        - article [ref=f14e211]:
          - button "Can I bring my dog?" [ref=f14e212] [cursor=pointer]
          - paragraph [ref=f14e215]: That depends on the venue for each in-person session. Check the individual event details before bringing a four-legged teammate.
        - article [ref=f14e216]:
          - button "Is virtual mentorship available?" [ref=f14e217] [cursor=pointer]
          - paragraph [ref=f14e220]: Yes, some support can happen remotely. Availability and formats will be shared with registered builders through the community channels.
        - article [ref=f14e221]:
          - button "How much does it cost to participate?" [ref=f14e222] [cursor=pointer]
          - paragraph [ref=f14e225]: Joining the hackathon and Superteam Germany’s community support is free.
        - article [ref=f14e226]:
          - button "What is the BuildStation Code of Conduct?" [ref=f14e227] [cursor=pointer]
          - paragraph [ref=f14e230]: BuildStation is an inclusive, collaborative environment. Participants are expected to treat one another respectfully and follow the venue and hackathon rules.
        - article [ref=f14e231]:
          - button "Did we miss something?" [ref=f14e232] [cursor=pointer]
          - paragraph [ref=f14e235]: Send us a message on X or Telegram and the team will help you find the right answer.
