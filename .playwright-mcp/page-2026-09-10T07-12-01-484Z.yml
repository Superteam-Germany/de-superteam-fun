      - generic [ref=f6e193]:
        - article [ref=f6e194]:
          - button "Who can participate?" [expanded] [ref=f6e195] [cursor=pointer]
          - paragraph [ref=f6e200]: Builders, founders, developers, designers, marketers and operators are welcome. You do not need to be a coder or an official Superteam member to take part.
        - article [ref=f6e201]:
          - button "Where is the BuildStation taking place?" [ref=f6e202] [cursor=pointer]
          - paragraph [ref=f6e205]: The hackathon itself is online. Germany-based co-working sessions and local BuildStation details will be shared through Superteam Germany’s official channels.
        - article [ref=f6e206]:
          - button "Are only German teams allowed to participate?" [ref=f6e207] [cursor=pointer]
          - paragraph [ref=f6e210]: No. Our support is focused on the German ecosystem, but international teammates and collaborators are welcome.
        - article [ref=f6e211]:
          - button "Can I bring my dog?" [ref=f6e212] [cursor=pointer]
          - paragraph [ref=f6e215]: That depends on the venue for each in-person session. Check the individual event details before bringing a four-legged teammate.
        - article [ref=f6e216]:
          - button "Is virtual mentorship available?" [ref=f6e217] [cursor=pointer]
          - paragraph [ref=f6e220]: Yes, some support can happen remotely. Availability and formats will be shared with registered builders through the community channels.
        - article [ref=f6e221]:
          - button "How much does it cost to participate?" [ref=f6e222] [cursor=pointer]
          - paragraph [ref=f6e225]: Joining the hackathon and Superteam Germany’s community support is free.
        - article [ref=f6e226]:
          - button "What is the BuildStation Code of Conduct?" [ref=f6e227] [cursor=pointer]
          - paragraph [ref=f6e230]: BuildStation is an inclusive, collaborative environment. Participants are expected to treat one another respectfully and follow the venue and hackathon rules.
        - article [ref=f6e231]:
          - button "Did we miss something?" [ref=f6e232] [cursor=pointer]
          - paragraph [ref=f6e235]: Send us a message on X or Telegram and the team will help you find the right answer.
