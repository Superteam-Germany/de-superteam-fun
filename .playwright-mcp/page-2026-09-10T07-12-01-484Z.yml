        - heading "Frequently asked questions." [level=2] [ref=f6e190]
        - paragraph [ref=f6e191]: Can’t find what you’re looking for? Reach out and we’ll point you in the right direction.
        - link "Ask us on X ↗" [ref=f6e192] [cursor=pointer]:
